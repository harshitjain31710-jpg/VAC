<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ollama AI Chatbot</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app {
            width: 900px;
            max-width: 95%;
            height: 90vh;
            background: white;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 5px 30px rgba(0, 0, 0, 0.12);
        }

        /* Header */

        .header {
            padding: 18px 25px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 20px;
        }

        .status {
            font-size: 13px;
            color: #16a34a;
        }

        /* Chat */

        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
        }

        .message {
            margin-bottom: 20px;
            display: flex;
        }

        .message.user {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 75%;
            padding: 13px 17px;
            border-radius: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .user .bubble {
            background: #2563eb;
            color: white;
        }

        .assistant .bubble {
            background: #eeeeee;
            color: #111;
        }

        /* Input */

        .input-area {
            border-top: 1px solid #ddd;
            padding: 15px;
            display: flex;
            gap: 10px;
        }

        textarea {
            flex: 1;
            resize: none;
            height: 50px;
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 14px;
            font-family: inherit;
            outline: none;
        }

        textarea:focus {
            border-color: #2563eb;
        }

        button {
            width: 80px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

    </style>

</head>

<body>

<div class="app">

    <div class="header">

        <h1>AI Assistant</h1>

        <div class="status" id="status">
            ● Ollama
        </div>

    </div>


    <div class="chat" id="chat">

        <div class="message assistant">

            <div class="bubble">
                Hello! How can I help you?
            </div>

        </div>

    </div>


    <div class="input-area">

        <textarea
            id="message"
            placeholder="Type your message..."
        ></textarea>

        <button
            id="send"
            onclick="sendMessage()"
        >
            Send
        </button>

    </div>

</div>


<script>

    const chat = document.getElementById("chat");
    const input = document.getElementById("message");
    const sendButton = document.getElementById("send");

    let history = [];


    function addMessage(role, text) {

        const message = document.createElement("div");

        message.className = "message " + role;

        const bubble = document.createElement("div");

        bubble.className = "bubble";

        bubble.textContent = text;

        message.appendChild(bubble);

        chat.appendChild(message);

        chat.scrollTop = chat.scrollHeight;
    }


    async function sendMessage() {

        const message = input.value.trim();

        if (!message) {
            return;
        }

        addMessage("user", message);

        input.value = "";

        sendButton.disabled = true;

        sendButton.textContent = "...";


        try {

            const response = await fetch("/chat", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    message: message,

                    history: history

                })

            });


            const data = await response.json();


            if (data.success) {

                addMessage(
                    "assistant",
                    data.response
                );


                history.push({

                    role: "user",

                    content: message

                });


                history.push({

                    role: "assistant",

                    content: data.response

                });

            }

            else {

                addMessage(
                    "assistant",
                    "Error: " + data.response
                );

            }

        }

        catch (error) {

            addMessage(
                "assistant",
                "Could not connect to the backend."
            );

            console.error(error);

        }


        sendButton.disabled = false;

        sendButton.textContent = "Send";

        input.focus();

    }


    // Enter = send
    // Shift + Enter = new line

    input.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


</script>

</body>

</html>
